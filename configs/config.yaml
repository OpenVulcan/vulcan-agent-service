# Vulcan MCP Client Configuration
# Place this file as config.yaml next to the executable, or specify via -config flag.

# HTTP transport address (optional).
# If set, enables HTTP Streamable + Legacy SSE transport.
# If absent, falls back to STDIO transport.
# http: "0.0.0.0:3000"

# LanceDb gRPC service endpoint (optional).
lancedb: "http://127.0.0.1:19302"

# Sqlite gRPC service endpoint (optional).
# When set, also enables the vmcp_scratchpad working memory store.
sqlite: "http://127.0.0.1:19502"

# VMM (VulcanMemoryMesh) gRPC service endpoint (optional).
# vmm: "http://localhost:50053"
