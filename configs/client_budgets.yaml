# 中文：客户端预算解析规则。
# English: Client budget resolution rules.
#
# 中文：若设置环境变量 `VULCAN_CLIENT_MATCH_NAME`，宿主会用该值强制覆盖当前客户端匹配名。
# English: When `VULCAN_CLIENT_MATCH_NAME` is set, the host force-overrides the current client match name with that value.
# 中文：HTTP / SSE 请求也可通过 `Vulcan-Client-Match-Name` 请求头强制覆盖当前客户端匹配名。
# English: HTTP / SSE requests can also force-override the current client match name with the `Vulcan-Client-Match-Name` header.

# 中文：宿主客户端预算配置格式版本；当前只接受 1。
# English: Host client-budget config format version; only 1 is accepted.
format_version: 1

defaults:
  estimation:
    # 中文：仅当客户端本身使用 tokens 计量时，才按该倍率折算成 bytes。
    # English: Only used when a client itself expresses limits in tokens; the value is converted into bytes with this multiplier.
    bytes_per_token: 3
    # 中文：宿主在向 Lua 暴露实际字节预算前预留的安全比例，默认保留 5% 余量。
    # English: Safety ratio applied by the host before exposing the effective byte budget to Lua, reserving 5% headroom by default.
    safe_bytes_ratio: 0.95
    # 中文：当客户端配置显式为不限时，实际对 Lua 暴露的字节上限默认封顶 200KB。
    # English: When a client explicitly declares "unlimited", the actual byte cap exposed to Lua defaults to 200KB.
    unlimited_bytes_cap: 204800
  budgets:
    tool_result:
      bytes:
        default: 20000
      lines:
        default: -1

# 中文：gRPC 专用精确客户端预算覆盖。key 必须等于协议中的 client_name；未命中时会回落到下方统一 clients pattern，不读取环境变量或 header 覆盖。
# English: Exact gRPC-only client budget overrides. Keys must equal the protocol client_name; misses fall back to the shared clients patterns below without env/header overrides.
grpc_clients: {}

clients:
  # 中文：以下客户端匹配规则复刻自 vulcan-codekit 原始已验证逻辑。
  # English: The client match rules below replicate the original validated logic from vulcan-codekit.
  - pattern: "VulcanMcpTest"
    budgets:
      tool_result:
        bytes:
          default: 20000
        lines:
          default: -1
      file_read:
        bytes:
          default: 20000
        lines:
          default: -1

  - pattern: "luaexec_call"
    budgets:
      tool_result:
        bytes:
          default: 20000
        lines:
          default: -1
      file_read:
        bytes:
          default: 20000
        lines:
          default: -1

  # qoder 客户端标记模糊，需要显示传递环境变量告知名称才可正确匹配
  # stdio 配置环境变量 VULCAN_CLIENT_MATCH_NAME
  # http/sse 配置头信息 Vulcan-Client-Match-Name
  - pattern: "qoder"
    budgets:
      tool_result:
        bytes:
          default: 50000
        lines:
          default: -1
      file_read:
        bytes:
          default: 50000
        lines:
          default: -1

  # workbuddy 客户端标记模糊，需要显示传递环境变量告知名称才可正确匹配
  # stdio 配置环境变量 VULCAN_CLIENT_MATCH_NAME
  # http/sse 配置头信息 Vulcan-Client-Match-Name
  - pattern: "workbuddy"
    budgets:
      tool_result:
        bytes:
          default: 50000
        lines:
          default: -1
      file_read:
        bytes:
          default: 50000
        lines:
          default: -1

  - pattern: "*qwen*"
    budgets:
      tool_result:
        bytes:
          default: 25000
          config_sources:
            - type: json
              path: "~/.qwen/settings.json"
              field: "tools.truncateToolOutputThreshold"
        lines:
          default: -1
          config_sources:
            - type: json
              path: "~/.qwen/settings.json"
              field: "tools.truncateToolOutputLines"

  - pattern: "codex-mcp-client"
    budgets:
      tool_result:
        tokens:
          default: 3334
          config_sources:
            - type: toml
              path: "~/.codex/config.toml"
              field: "tool_output_token_limit"

  # DeepSeek Harness（DSH）在 MCP initialize 握手中自带唯一标识
  # clientInfo.name = "dsh-mcp-client"，且既不设置 VULCAN_CLIENT_MATCH_NAME，
  # 也不发送 Vulcan-Client-Match-Name 头，因此预算匹配看到的就是该自带标识，
  # 用精确 pattern 命中即可，客户端侧无需任何额外配置。
  # English: DeepSeek Harness (DSH) self-identifies in the MCP initialize
  # handshake as clientInfo.name = "dsh-mcp-client" and overrides it through
  # neither VULCAN_CLIENT_MATCH_NAME nor the Vulcan-Client-Match-Name header, so
  # budget matching sees that built-in identity and this exact pattern is enough.
  #
  # DSH 自身负责超限工具结果：其 spill-policy 在超过 50000 UTF-8 字节时把全文写入
  # spill 文件，只把有界的首尾预览交给模型；因此这里声明为不限（-1，按
  # unlimited_bytes_cap 封顶 200KB，再经 safe_bytes_ratio 后实际约 190KB）。
  # 若服务端提前按 50000 字节截断，DSH 落盘的将是被截断的副本而不是全文。
  # English: DSH owns oversized tool results itself: its spill-policy writes the
  # full text to a spill file above 50000 UTF-8 bytes and hands the model only a
  # bounded head/tail preview, so the budget is declared unlimited (-1, capped by
  # unlimited_bytes_cap at 200KB and exposed as ~190KB after safe_bytes_ratio).
  # Truncating at 50000 here would leave DSH spilling an already-cut copy.
  - pattern: "dsh-mcp-client"
    budgets:
      tool_result:
        bytes:
          default: -1
        lines:
          default: -1
      file_read:
        bytes:
          default: -1
        lines:
          default: -1

  - pattern: "*claude-code*"
    budgets:
      tool_result:
        tokens:
          default: 16667
          config_sources:
            - type: env
              key: "MAX_MCP_OUTPUT_TOKENS"
      file_read:
        tokens:
          default: 16667
          config_sources:
            - type: env
              key: "CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS"

  - pattern: "*opencode*"
    budgets:
      tool_result:
        lines:
          default: 2000
          config_sources:
            - type: json
              path: "~/.config/opencode/opencode.json"
              field: "tool_output.max_lines"
        bytes:
          default: 51200
          config_sources:
            - type: json
              path: "~/.config/opencode/opencode.json"
              field: "tool_output.max_bytes"
