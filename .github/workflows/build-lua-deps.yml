name: Build Lua C Dependencies

# Pre-built binaries for lua_deps. Trigger manually or when deps change.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. deps-v1)"
        required: true
        default: "deps-v1"
      linux_x64:
        description: "Linux x64 runner"
        required: true
        default: "9950x"
        type: choice
        options: [ "9950x", "proart", "ubuntu-24.04" ]
      linux_arm:
        description: "Linux ARM runner"
        required: true
        default: "9950x"
        type: choice
        options: [ "9950x", "proart", "ubuntu-24.04" ]
      mac_arm:
        description: "macOS ARM runner"
        required: true
        default: "macos-15"
        type: choice
        options: [ "macos-15", "9950x", "proart" ]
      win_x64:
        description: "Windows x64 runner"
        required: true
        default: "9950x-win"
        type: choice
        options: [ "9950x-win", "proart-win", "windows-latest" ]

permissions:
  contents: write

concurrency:
  group: lua-deps-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: >-
      ${{
        (startsWith(matrix.runner, 'ubuntu') || startsWith(matrix.runner, 'macos') || startsWith(matrix.runner, 'windows'))
        && fromJSON(format('["{0}"]', matrix.runner))
        || fromJSON(format('["self-hosted", "{0}"]', matrix.runner))
      }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ${{ inputs.linux_x64 || '9950x' }}
            platform: linux-x64
            os: Linux
            pkg_openssl: openssl/3.4.1
            pkg_zlib: zlib/1.3.1
            pkg_pcre2: pcre2/10.45
            pkg_libyaml: libyaml/0.2.5
          - runner: ${{ inputs.linux_arm || '9950x' }}
            platform: linux-arm64
            os: Linux
            pkg_openssl: openssl/3.4.1
            pkg_zlib: zlib/1.3.1
            pkg_pcre2: pcre2/10.45
            pkg_libyaml: libyaml/0.2.5
          - runner: ${{ inputs.mac_arm || 'macos-15' }}
            platform: macos-arm64
            os: macOS
            pkg_openssl: openssl/3.4.1
            pkg_zlib: zlib/1.3.1
            pkg_pcre2: pcre2/10.45
            pkg_libyaml: libyaml/0.2.5
          - runner: ${{ inputs.win_x64 || '9950x-win' }}
            platform: windows-x64
            os: Windows
            pkg_openssl: openssl/3.4.1
            pkg_zlib: zlib/1.3.1
            pkg_pcre2: pcre2/10.45
            pkg_libyaml: libyaml/0.2.5
    steps:
      - uses: actions/checkout@v4

      # --- Windows ---
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install cmake + ninja + nasm via Chocolatey (nasm needed for OpenSSL)
          $missing = @()
          foreach ($tool in @('cmake', 'ninja', 'nasm')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $missing += $tool
            }
          }
          if ($missing.Count -gt 0) {
            choco install -y @missing --no-progress
          }

          # Install StrawberryPerl portable via direct download (choco package is broken)
          if (-not (Get-Command 'perl' -ErrorAction SilentlyContinue)) {
            $perlUrl = "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_53822_64bit/strawberry-perl-5.38.2.2-64bit-portable.zip"
            $perlUrl2 = "https://strawberryperl.com/download/5.38.2.2/strawberry-perl-5.38.2.2-64bit-portable.zip"
            $perlZip = "$env:TEMP\strawberry-perl.zip"
            $perlDir = "$env:GITHUB_WORKSPACE\third_party\tools\perl"
            try { curl -fSL $perlUrl -o $perlZip } catch { curl -fSL $perlUrl2 -o $perlZip }
            Expand-Archive $perlZip -DestinationPath $perlDir -Force
            $perlBin = "$perlDir\perl\bin"
            $env:PATH = "$perlBin;$env:PATH"
            Add-Content $env:GITHUB_PATH "$perlBin"
            perl -v
          }

          # Add NASM to PATH (just installed via choco above)
          $nasmPath = "C:\Program Files\NASM"
          if (Test-Path $nasmPath) {
            $env:PATH = "$nasmPath;$env:PATH"
            Add-Content $env:GITHUB_PATH $nasmPath
          }

      - name: Build OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz"
          curl -fSL $url -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          Push-Location openssl-3.4.1
          perl Configure VC-WIN64A --prefix="$env:GITHUB_WORKSPACE\deps\openssl" --openssldir="$env:GITHUB_WORKSPACE\deps\openssl\ssl" no-tests no-shared
          nmake
          nmake install_sw
          Pop-Location

      - name: Build zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          curl -fSL $url -o zlib.tar.gz
          tar -xzf zlib.tar.gz
          Push-Location zlib-1.3.1
          $b = "build"; mkdir $b; Push-Location $b
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\deps\zlib" -DBUILD_SHARED_LIBS=ON
          ninja install
          Pop-Location; Pop-Location

      - name: Build PCRE2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz"
          curl -fSL $url -o pcre2.tar.gz; tar -xzf pcre2.tar.gz
          Push-Location pcre2-10.45
          $b = "build"; mkdir $b; Push-Location $b
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\deps\pcre2" -DBUILD_SHARED_LIBS=OFF -DPCRE2_SUPPORT_JIT=ON
          ninja install
          Pop-Location; Pop-Location

      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgDir = "$env:USERPROFILE\.vcpkg"
          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            iex (iwr -usef https://aka.ms/vcpkg-init.ps1)
          }
          $env:PATH = "$vcpkgDir;$env:PATH"
          Add-Content $env:GITHUB_PATH "$vcpkgDir"

      - name: Build LibYAML via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgDir = "$env:USERPROFILE\.vcpkg"
          & "$vcpkgDir\vcpkg.exe" install libyaml:x64-windows-static --triplet=x64-windows-static
          # Copy installed files to deps directory
          $dest = "$env:GITHUB_WORKSPACE\deps\libyaml"
          New-Item -ItemType Directory -Force -Path "$dest\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest\include" | Out-Null
          Copy-Item "$vcpkgDir\installed\x64-windows-static\lib\*.lib" "$dest\lib\" -Force
          Copy-Item "$vcpkgDir\installed\x64-windows-static\include\yaml.h" "$dest\include\" -Force

      # --- Linux ---
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl libperl-dev

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/deps"
          JOBS=$(nproc)

          # OpenSSL
          curl -fSL https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz | tar xz
          cd openssl-3.4.1
          ./config --prefix="$PREFIX/openssl" --openssldir="$PREFIX/openssl/ssl" no-tests no-shared
          make -j$JOBS && make install_sw
          cd ..

          # zlib (github mirror, zlib.net often blocked/unreliable)
          curl -fSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          cd zlib-1.3.1
          ./configure --prefix="$PREFIX/zlib" --static
          make -j$JOBS && make install
          cd ..

          # PCRE2
          curl -fSL https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz | tar xz
          cd pcre2-10.45
          ./configure --prefix="$PREFIX/pcre2" --enable-jit --disable-shared
          make -j$JOBS && make install
          cd ..

          # libyaml
          curl -fSL https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz | tar xz
          cd yaml-0.2.5
          ./configure --prefix="$PREFIX/libyaml" --disable-shared
          make -j$JOBS && make install
          cd ..

      # --- macOS ---
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake perl

      - name: Build deps (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/deps"
          JOBS=$(sysctl -n hw.ncpu)

          # OpenSSL
          curl -fSL https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz | tar xz
          cd openssl-3.4.1
          ./config --prefix="$PREFIX/openssl" --openssldir="$PREFIX/openssl/ssl" no-tests no-shared
          make -j$JOBS && make install_sw
          cd ..

          # zlib (github mirror, zlib.net often blocked/unreliable)
          curl -fSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          cd zlib-1.3.1
          ./configure --prefix="$PREFIX/zlib" --static
          make -j$JOBS && make install
          cd ..

          # PCRE2
          curl -fSL https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz | tar xz
          cd pcre2-10.45
          ./configure --prefix="$PREFIX/pcre2" --enable-jit --disable-shared
          make -j$JOBS && make install
          cd ..

          # libyaml
          curl -fSL https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz | tar xz
          cd yaml-0.2.5
          ./configure --prefix="$PREFIX/libyaml" --disable-shared
          make -j$JOBS && make install
          cd ..

      # --- Package and upload ---
      - name: Package deps
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deps"
          tar czf "$GITHUB_WORKSPACE/lua-deps-${{ matrix.platform }}.tar.gz" openssl/ zlib/ pcre2/ libyaml/
          echo "Package size: $(du -h "$GITHUB_WORKSPACE/lua-deps-${{ matrix.platform }}.tar.gz" | cut -f1)"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: lua-deps-${{ matrix.platform }}.tar.gz
          tag_name: ${{ inputs.version }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
