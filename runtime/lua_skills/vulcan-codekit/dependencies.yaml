dependencies:
  - name: "ast-grep"
    install_as: "ast-grep.exe"
    github:
      repo: "https://github.com/ast-grep/ast-grep"
      tag_api: "https://api.github.com/repos/ast-grep/ast-grep/releases/latest"
    targets:
      - os: "windows"
        arch: "x86_64"
        asset_name: "app-x86_64-pc-windows-msvc.zip"
        install_as: "ast-grep.exe"
        archive_path: "ast-grep.exe"
        executable: false
      - os: "linux"
        arch: "x86_64"
        asset_name: "app-x86_64-unknown-linux-gnu.zip"
        install_as: "ast-grep"
        archive_path: "ast-grep"
        executable: true
      - os: "linux"
        arch: "aarch64"
        asset_name: "app-aarch64-unknown-linux-gnu.zip"
        install_as: "ast-grep"
        archive_path: "ast-grep"
        executable: true
      - os: "macos"
        arch: "aarch64"
        asset_name: "app-aarch64-apple-darwin.zip"
        install_as: "ast-grep"
        archive_path: "ast-grep"
        executable: true
  - name: "rg"
    install_as: "rg.exe"
    github:
      repo: "https://github.com/BurntSushi/ripgrep"
      tag_api: "https://api.github.com/repos/BurntSushi/ripgrep/releases/latest"
    targets:
      - os: "windows"
        arch: "x86_64"
        asset_name: "ripgrep-{version}-x86_64-pc-windows-msvc.zip"
        install_as: "rg.exe"
        archive_path: "ripgrep-{version}-x86_64-pc-windows-msvc/rg.exe"
        executable: false
      - os: "linux"
        arch: "x86_64"
        asset_name: "ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz"
        install_as: "rg"
        archive_path: "ripgrep-{version}-x86_64-unknown-linux-musl/rg"
        executable: true
      - os: "linux"
        arch: "aarch64"
        asset_name: "ripgrep-{version}-aarch64-unknown-linux-gnu.tar.gz"
        install_as: "rg"
        archive_path: "ripgrep-{version}-aarch64-unknown-linux-gnu/rg"
        executable: true
      - os: "macos"
        arch: "aarch64"
        asset_name: "ripgrep-{version}-aarch64-apple-darwin.tar.gz"
        install_as: "rg"
        archive_path: "ripgrep-{version}-aarch64-apple-darwin/rg"
        executable: true
