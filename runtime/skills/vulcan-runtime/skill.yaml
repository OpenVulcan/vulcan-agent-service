name: vulcan-runtime
debug: true
help:
  main:
    description: Vulcan Runtime 的主帮助，包含执行工作流与系统能力说明。
    file: help/help.md
  topics:
    - name: runtime-overview
      description: 运行时总览与能力边界。
      file: help/help.md
    - name: system-tools
      description: 当前正式暴露的 vulcan.runtime system tools 与公开命名空间。
      file: help/help.md
    - name: lua-exec
      description: 内联 Lua 执行工作流说明。
      file: help/lua-exec.md
    - name: lua-file
      description: Lua 文件执行工作流说明。
      file: help/lua-file.md
entries:
  - name: lua-exec
    description: "Execute short ad-hoc Lua runtime code for loops, one-off file generation, lightweight network or command orchestration, and data transformation. In MCP hosts, read help through `vulcan-help-detail` with skill=`vulcan-runtime` and flow=`lua-exec` or `main` before execution when guidance is needed."
    lua_entry: runtime/vulcan-lua-exec.lua
    lua_module: vulcan_lua_exec
    help: lua-exec
    parameters:
      - name: task
        type: string
        description: "Optional human-readable task summary shown in the execution result header."
        required: false
      - name: code
        type: string
        description: "Lua source code executed inside the isolated luaexec runtime VM."
        required: true
      - name: args
        type: object
        description: "Optional structured arguments exposed to the script as the local variable `args`."
        required: false
      - name: timeout_ms
        type: number
        description: "Optional execution timeout in milliseconds. Defaults to 60000."
        required: false
  - name: lua-file
    description: "Execute an existing Lua script file with cwd automatically switched to that file's directory. In MCP hosts, read help through `vulcan-help-detail` with skill=`vulcan-runtime` and flow=`lua-file` or `main` before execution when guidance is needed."
    lua_entry: runtime/vulcan-lua-file.lua
    lua_module: vulcan_lua_file
    help: lua-file
    parameters:
      - name: task
        type: string
        description: "Optional human-readable task summary shown in the execution result header."
        required: false
      - name: file
        type: string
        description: "Lua file path executed inside the isolated luaexec runtime VM. During execution the cwd automatically switches to the file directory."
        required: true
      - name: args
        type: object
        description: "Optional structured arguments exposed to the script as the local variable `args`."
        required: false
      - name: timeout_ms
        type: number
        description: "Optional execution timeout in milliseconds. Defaults to 60000."
        required: false
