name: vulcan-lua
version: 0.1.0
debug: false
help:
  main:
    description: Vulcan Lua 的帮助文件，告知具体的工具使用说明
    file: help/help.md
entries:
  - name: run
    description: "Run one Lua task through the controlled runtime bridge. Provide exactly one of `code` or `file`. Use `code` for short inline execution, or `file` for an existing Lua script that should run with cwd switched to the script directory. When guidance is needed, read `vulcan-help-detail` with skill=`vulcan-lua` and flow=`main`."
    lua_entry: runtime/vulcan-lua-run.lua
    lua_module: vulcan_lua_run
    parameters:
      - name: task
        type: string
        description: "Optional task summary shown in the result header. Default: omitted."
        required: false
      - name: code
        type: string
        description: "Optional inline Lua source code. Use this for short ad-hoc execution. Default: omitted. Exactly one of `code` or `file` must be provided."
        required: false
      - name: file
        type: string
        description: "Optional Lua file path. Use this when the logic already lives in one `.lua` file. Default: omitted. Exactly one of `code` or `file` must be provided."
        required: false
      - name: args
        type: object
        description: "Optional structured arguments exposed inside the script as the local variable `args`. Default: `{}`."
        required: false
      - name: timeout_ms
        type: number
        description: "Optional execution timeout in milliseconds. Default: `60000`."
        required: false
