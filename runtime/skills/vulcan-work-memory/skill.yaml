name: vulcan-work-memory
skill_id: vulcan-work-memory
debug: true
sqlite:
  enable: true
  log_level: info
  slow_log_enabled: true
  slow_log_threshold_ms: 500
help:
  main:
    description: Vulcan Work Memory 的主帮助，描述 SQLite 工作记忆测试入口与用途。
    file: help/help.md
  topics:
    - name: sqlite-test
      description: SQLite 工作记忆测试说明。
      file: help/sqlite-test.md
entries:
  - name: sqlite-test
    description: "Create or reuse the shared work-memory SQLite database under runtime/databases/sqlite/vulcan-work-memory, insert one test row, and return the latest database state."
    lua_entry: runtime/vulcan-work-memory-sqlite-test.lua
    lua_module: vulcan_work_memory_sqlite_test
    help: sqlite-test
    parameters:
      - name: note
        type: string
        description: "Optional note content inserted into the test table. When omitted, the tool writes a stable default message."
        required: false
