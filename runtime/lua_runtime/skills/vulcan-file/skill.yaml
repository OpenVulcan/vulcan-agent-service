name: vulcan-file
version: 0.1.9
debug: false
help:
  main:
    description: Help agents decide when to use vulcan-file instead of CodeKit, rg, or shell snippets.
    file: help/help.md
  topics:
    - name: create
      description: Create one or more brand-new files, with no_apply=true available for preview-only behavior.
      file: help/create.md
    - name: read
      description: Read one or more raw text snippets, or batch multiple known file reads in one call.
      file: help/read.md
    - name: list
      description: Find candidate files cheaply before reading them.
      file: help/list.md
    - name: edit
      description: Make one or more small text edits after target lines have been inspected, with no_apply=true available for preview-only behavior.
      file: help/edit.md
    - name: delete
      description: Preview and delete one or more regular files without supporting directory removal.
      file: help/delete.md
entries:
  - name: create
    description: "[AI FILE CREATE] Use when you want to create one brand-new file or up to 10 brand-new files. It writes by default, supports no_apply=true for preview-only behavior, errors when a target file already exists, and returns a host change_set when supported."
    lua_entry: runtime/vulcan-file-create.lua
    lua_module: vulcan_file_create
    help: create
    input_schema_file: schemas/create.input.schema.json
  - name: read
    description: "[AI FILE READ] Use when you already know the target file and line area and need exact source text. It supports single-file reads or up to 10 batch file reads. Prefer segments as an array of {start, count} objects; keep lines_rule only for legacy clients that cannot send arrays. Do not use this to search; use codekit-rg first."
    lua_entry: runtime/vulcan-file-read.lua
    lua_module: vulcan_file_read
    help: read
    input_schema_file: schemas/read.input.schema.json
  - name: list
    description: "[AI FILE LIST] Use before reading when you need to find candidate files cheaply. Prefer this over shell directory loops for a compact ignored-aware file map. Use codekit tools instead when you need AST structure."
    lua_entry: runtime/vulcan-file-list.lua
    lua_module: vulcan_file_list
    help: list
    input_schema_file: schemas/list.input.schema.json
  - name: edit
    description: "[AI FILE EDIT] Use for small text edits after you have read the target lines. It supports single-file edits or up to 10 batch edits, writes by default, and supports no_apply=true for preview-only behavior."
    lua_entry: runtime/vulcan-file-edit.lua
    lua_module: vulcan_file_edit
    help: edit
    input_schema_file: schemas/edit.input.schema.json
  - name: delete
    description: "[AI FILE DELETE] Use to delete or preview one regular file or up to 10 regular files. It rejects directories explicitly, deletes by default, recommends no_apply=true previews before deletion, and returns a host change_set when supported."
    lua_entry: runtime/vulcan-file-delete.lua
    lua_module: vulcan_file_delete
    help: delete
    input_schema_file: schemas/delete.input.schema.json
