name: vulcan-testkit
version: 0.1.2
debug: false
help:
  main:
    description: Vulcan TestKit help for bounded AI validation routing and compact Markdown diagnostics.
    file: help/help.md
  topics:
    - name: run
      description: Run one bounded validation command or analyze one existing validation log; never use it as a general shell.
      file: help/run.md
entries:
  - name: run
    description: "[AI VALIDATION ROUTER] Use for bounded build/test/check/lint/typecheck validation when output may be long. Choose exactly one mode: run mode with `program` plus optional `args`, or analyze-only mode with `log`; do not provide both `program` and `log`. It returns compact Markdown root diagnostics, failed tests, source refs, collapsed noise, and next actions instead of full stdout/stderr. Run mode only accepts registered validation profiles and rejects shell/app-runtime/install/publish/create/debug/fix/write/browser/benchmark/fuzz/watch/dev-server shapes, including hidden global options, package-manager scripts, exec targets, and passthrough args. Do not use for general shell automation, git, file operations, deployments, or destructive commands."
    lua_entry: runtime/vulcan-testkit-run.lua
    lua_module: vulcan_testkit_run
    input_schema_file: schemas/run.input.schema.json
    help: run
