name: __demo
debug: true
lancedb:
  enable: false
  log_level: info
  slow_log_enabled: false
  slow_log_threshold_ms: 800
help:
  main:
    description: __demo 模板 skill 的主帮助，用于说明新的目录结构与迁移后的最小模型。
    file: help/static_prompt.md
  topics:
    - name: dynamic-workflow
      description: 动态帮助节点示例，演示如何用 Lua 生成帮助文本。
      file: help/dynamic_prompt.lua
entries:
  - name: template-tool
    description: "Demo skill template that shows one entry example and returns Markdown string output."
    lua_entry: runtime/demo_template_tool.lua
    lua_module: demo_template_primary
    help: overview
    parameters:
      - name: name
        type: string
        description: "Display name used by the demo tool response."
        required: false
      - name: emphasis
        type: string
        description: "Optional emphasis string appended to the demo response."
        required: false
  - name: template-summary
    description: "Second entry example that shows string output plus the optional overflow multi-return protocol."
    lua_entry: runtime/demo_template_summary.lua
    lua_module: demo_template_summary
    help: dynamic-workflow
    parameters:
      - name: name
        type: string
        description: "Display name used by the summary tool response."
        required: false
