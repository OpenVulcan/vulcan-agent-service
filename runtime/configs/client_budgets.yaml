# 中文：客户端预算解析规则。
# English: Client budget resolution rules.

defaults:
  estimation:
    # 中文：仅当客户端本身使用 tokens 计量时，才按该倍率折算成 bytes。
    # English: Only used when a client itself expresses limits in tokens; the value is converted into bytes with this multiplier.
    bytes_per_token: 3
    # 中文：宿主在向 Lua 暴露实际字节预算前预留的安全比例，默认保留 5% 余量。
    # English: Safety ratio applied by the host before exposing the effective byte budget to Lua, reserving 5% headroom by default.
    safe_bytes_ratio: 0.95
    # 中文：当客户端配置显式为不限时，实际对 Lua 暴露的字节上限默认封顶 200KB。
    # English: When a client explicitly declares "unlimited", the actual byte cap exposed to Lua defaults to 200KB.
    unlimited_bytes_cap: 204800
  budgets:
    tool_result:
      bytes:
        default: 10000
      lines:
        default: -1

clients:
  # 中文：以下客户端匹配规则复刻自 vulcan-codekit 原始已验证逻辑。
  # English: The client match rules below replicate the original validated logic from vulcan-codekit.
  - pattern: "VulcanMcpTest"
    budgets:
      tool_result:
        bytes:
          default: 10000
        lines:
          default: -1
      file_read:
        bytes:
          default: 10000
        lines:
          default: -1

  - pattern: "luaexec_call"
    budgets:
      tool_result:
        bytes:
          default: 10000
        lines:
          default: -1
      file_read:
        bytes:
          default: 10000
        lines:
          default: -1

  - pattern: "mcphost"
    budgets:
      tool_result:
        bytes:
          default: 100000
        lines:
          default: -1
      file_read:
        bytes:
          default: 100000
        lines:
          default: -1

  - pattern: "*qwen*"
    budgets:
      tool_result:
        bytes:
          default: 25000
          config_sources:
            - type: json
              path: "~/.qwen/settings.json"
              field: "tools.truncateToolOutputThreshold"
        lines:
          default: -1
          config_sources:
            - type: json
              path: "~/.qwen/settings.json"
              field: "tools.truncateToolOutputLines"

  - pattern: "codex-mcp-client"
    budgets:
      tool_result:
        tokens:
          default: 3334
          config_sources:
            - type: toml
              path: "~/.codex/config.toml"
              field: "tool_output_token_limit"

  - pattern: "*claude-code*"
    budgets:
      tool_result:
        tokens:
          default: 16667
          config_sources:
            - type: env
              key: "MAX_MCP_OUTPUT_TOKENS"
      file_read:
        tokens:
          default: 16667
          config_sources:
            - type: env
              key: "CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS"

  - pattern: "*opencode*"
    budgets:
      tool_result:
        lines:
          default: 2000
        bytes:
          default: 51200
