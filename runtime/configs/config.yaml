# ============================================================
# Vulcan Agent Service Runtime Config Template
# 中文：仓库中的配置模板文件。构建后会同步到 output/configs/config.yaml。
# English: Repository config template. It will be synced to output/configs/config.yaml during build.
# ============================================================

# 中文：宿主应用配置格式版本；当前只接受 1。
# English: Host application config format version; only 1 is accepted.
format_version: 1

# 中文：HTTP MCP / IDE 适配服务监听地址。默认值为 127.0.0.1:19201。
# English: HTTP MCP/IDE adapter listen address. Default is 127.0.0.1:19201.
http: "127.0.0.1:19201"

# 中文：统一 gRPC 服务监听地址。默认值为 127.0.0.1:19202，同一端口承载 McpService、LuaSkillsService、HostAdapterService 与 VMM relay。
# English: Unified gRPC listen address. Default is 127.0.0.1:19202; the same endpoint carries McpService, LuaSkillsService, HostAdapterService, and the VMM relay surface.
grpc: "127.0.0.1:19202"

# 中文：VulcanMemoryMesh (VMM) gRPC 服务地址。启用画像、记忆等能力时使用。
# English: VulcanMemoryMesh (VMM) gRPC service endpoint for memory/profile features.
# 中文：vmm 仅保存端点；只有 vmm_enable=true 时才会连接，并自动跳过由 VMM 替代的 AI 记忆 skill。
# English: `vmm` only stores the endpoint; the host connects only when `vmm_enable=true` and then skips the AI memory skill replaced by VMM.
# 示例 / Example:
vmm_enable: true
vmm: "http://127.0.0.1:17625"

# 中文：默认环境使用的正式技能层级，仅支持 ROOT、PROJECT、USER，运行时固定按 ROOT -> PROJECT -> USER 解析。
# English: Formal skill layers for the default environment; only ROOT, PROJECT, and USER are supported, and runtime resolution is fixed as ROOT -> PROJECT -> USER.
# 中文：ROOT 是系统控制层，通常承载官方核心技能；PROJECT/USER 是普通技能层，用户动态安装默认落在 USER。
# English: ROOT is the system-controlled layer for official core skills; PROJECT/USER are ordinary skill layers, and dynamic user installs default to USER.
# 中文：每个技能根必须显式声明正式层级名称与路径。
# English: Every skill root must explicitly declare its formal layer name and path.
# skill_roots:
#   - name: "ROOT"
#     path: "D:/projects/vulcan-agent-service/output/lua_runtime/skills"
#   - name: "USER"
#     path: "C:/Users/yourname/.vulcan/agent-service/skills"

# Optional application root. Host binaries, configs, and logs live under it, while the complete LuaSkills runtime is isolated at `<runtime_root>/lua_runtime`.
# 可选的应用根目录。宿主二进制、配置与日志位于该根下，LuaSkills 完整运行时固定隔离在 `<runtime_root>/lua_runtime`。
# Windows 示例 / Windows example:
# runtime_root: "D:/projects/vulcan-agent-service/output"
# Linux/macOS 示例 / Linux/macOS example:
# runtime_root: "/opt/vulcan/output"
# 中文：LuaSkills 0.5.5 技能包配置使用独立的用户级绝对根目录。
# English: LuaSkills 0.5.5 package configuration uses a dedicated absolute user-level root.
# 中文：省略时，Windows 使用 `%USERPROFILE%\.vulcan\agent-service\config`，Unix 使用 `$HOME/.vulcan/agent-service/config`。
# English: When omitted, Windows uses `%USERPROFILE%\.vulcan\agent-service\config`; Unix uses `$HOME/.vulcan/agent-service/config`.
# 中文：正式服务部署建议显式配置，LuaSkills 会派生 `skills/config.json` 与 `system-skills/config.json`。
# English: Explicit configuration is recommended for services; LuaSkills derives `skills/config.json` and `system-skills/config.json`.
# skill_config_root: "C:/Users/yourname/.vulcan/agent-service/config"

# LuaSkills derives managed Python/Node distributions and writable environments as `lua_runtime/dependencies/runtimes` and `lua_runtime/dependencies/envs` by default.
# 受管 Python/Node 发行根与可写环境根默认由 LuaSkills 固定推导为 `lua_runtime/dependencies/runtimes` 与 `lua_runtime/dependencies/envs`。
# Configure these only when distributions or writable environments must live on separate storage; relative paths are anchored to the application root.
# 只有需要把只读发行包或可写环境放到独立磁盘时才配置；相对路径以应用根为基准。
# managed_runtime_distribution_root: "lua_runtime/dependencies/runtimes"
# managed_runtime_environment_root: "lua_runtime/dependencies/envs"

# Managed worker and persistent-session policy. Omitted fields inherit the exact LuaSkills 0.5.5 defaults.
# 受管 Worker 与持久会话策略。省略字段时继承当前 LuaSkills 0.5.5 的精确默认值。
# managed_runtime_config:
#   worker_pool_max_size_per_environment: 4
#   worker_idle_ttl_secs: 60
#   persistent_session_limit_per_engine: 256
#   persistent_session_default_buffer_limit_bytes_per_stream: 1048576
#   invoke_default_timeout_ms: 30000

# 中文：vulcan-agent-service 固定通过 space_controller 访问 SQLite 与 LanceDB，以避免多个服务入口并发访问同一数据库时的文件锁冲突。
# English: vulcan-agent-service always accesses SQLite and LanceDB through space_controller so concurrent service entries avoid direct file-lock conflicts.
# 中文：当前 agent-service 产品固定通过 controller-only 方式访问数据库，不提供数据库模式切换项。
# English: The current agent-service product uses a controller-only database access model and does not expose database mode switches.
# 中文：space_controller 配置用于指定共享端点、自动拉起策略和本地复制后的可执行文件路径。
# English: space_controller settings define the shared endpoint, auto-spawn policy, and copied local executable path.
# 中文：如果需要修改 controller 默认端口，直接改 endpoint 里的端口号即可，例如改成 20333。
# English: To change the controller default port, edit the port number in endpoint directly, for example 20333.
# 中文：若 auto_spawn=true，则 endpoint 必须是本地可拉起地址；远端 controller 只能与 auto_spawn=false 搭配使用。
# English: When auto_spawn=true, endpoint must be a locally spawnable address. Remote controllers must be used with auto_spawn=false.
# Prefer make deps + make build to sync the controller binary so output/lua_runtime/bin/vldb-controller.exe does not drift from the pinned vldb-controller-client release tag.
# 建议优先通过 make deps + make build 同步 controller 二进制，避免 output/lua_runtime/bin/vldb-controller.exe 与当前锁定的 vldb-controller-client release tag 漂移。
space_controller:
  endpoint: "http://127.0.0.1:19801"
  auto_spawn: true
  # Optional by default; after make deps + make build the host auto-discovers output/lua_runtime/bin/vldb-controller.exe.
  # 默认可省略；执行 make deps + make build 后会自动从 output/lua_runtime/bin/vldb-controller.exe 发现。
  # executable_path: "D:/projects/vulcan-agent-service/output/lua_runtime/bin/vldb-controller.exe"
  process_mode: "managed"
  minimum_uptime_secs: 300
  idle_timeout_secs: 900
  default_lease_ttl_secs: 120
  connect_timeout_secs: 5
  startup_timeout_secs: 15
  startup_retry_interval_ms: 250
  lease_renew_interval_secs: 30

# ============================================================
# Lua VM Pool
# 中文：普通 Lua 虚拟机主池配置。用于并发复用常规 skill 调用与普通 run_lua 路径的 Lua 运行时，降低频繁建虚拟机的开销。
# English: Primary Lua VM pool settings for regular skill calls and the ordinary run_lua path so Lua runtimes can be reused with lower creation overhead.
# ============================================================

# 中文：Lua 虚拟机池最小常驻实例数。启动后会预热到该数量。
# English: Minimum number of warm Lua VMs kept in the pool after startup.
# 示例 / Example:
lua_vm_pool_min_size: 2

# 中文：Lua 虚拟机池允许的最大实例数。高并发时会按需增长到该上限。
# English: Maximum number of Lua VMs allowed in the pool. The pool can grow on demand up to this limit.
# 示例 / Example:
lua_vm_pool_max_size: 8

# 中文：超过最小常驻数量的 Lua 虚拟机空闲多久后可被回收（秒）。
# English: Idle lifetime in seconds before excess Lua VMs above the minimum warm count may be destroyed.
# 示例 / Example:
lua_vm_pool_idle_ttl_secs: 600

# ============================================================
# RunLua Dedicated VM Pool
# 中文：隔离 `vulcan.runtime.lua.exec` 专用 VM 池配置。只作用于 runlua 隔离执行链，不影响普通 skill VM 主池。
# English: Dedicated VM pool settings for isolated `vulcan.runtime.lua.exec`. They affect only the isolated runlua execution path and do not change the primary skill VM pool.
# 中文：该配置映射到 `LuaRuntimeHostOptions.runlua_pool_config`。如果整个配置段缺失，宿主会保留上游默认行为。
# English: This block maps to `LuaRuntimeHostOptions.runlua_pool_config`. When the whole block is absent, the host preserves the upstream default behavior.
# 中文：当前上游默认值为 `min_size=1 / max_size=4 / idle_ttl_secs=60`。
# English: The current upstream defaults are `min_size=1 / max_size=4 / idle_ttl_secs=60`.
# ============================================================
runlua_pool_config:
  min_size: 1
  max_size: 4
  idle_ttl_secs: 60

# 中文：强制跳过的技能 ID 列表。默认不配置；配置后会在依赖准备、数据库绑定和 entry 注册前跳过对应 skill。
# English: Skill IDs that must be skipped. Leave unset by default; matched skills are skipped before dependency setup, database binding, and entry registration.
# 中文：当 vmm_enable=true 且 vmm 非空时，宿主会自动跳过 vulcan-ai-memory；vulcan-work-memory 仍继续走 SQLite skill。
# English: When `vmm_enable=true` and `vmm` is non-empty, the host automatically skips `vulcan-ai-memory`; `vulcan-work-memory` keeps using the SQLite skill path.
# 示例 / Example:
# ignored_skill_ids:
#   - "custom-ai-memory"
