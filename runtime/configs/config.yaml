# ============================================================
# Vulcan MCP Runtime Config Template
# 中文：仓库中的配置模板文件。构建后会同步到 output/configs/config.yaml。
# English: Repository config template. It will be synced to output/configs/config.yaml during build.
# ============================================================

# 中文：HTTP MCP 服务监听地址。默认值为 127.0.0.1:19201。
# English: HTTP MCP service listen address. Default is 127.0.0.1:19201.
http: "127.0.0.1:19201"

# 中文：gRPC 管理服务监听地址。默认值为 127.0.0.1:19202。
# English: gRPC management service listen address. Default is 127.0.0.1:19202.
grpc: "127.0.0.1:19202"

# 中文：VulcanMemoryMesh (VMM) gRPC 服务地址。启用画像、记忆等能力时使用。
# English: VulcanMemoryMesh (VMM) gRPC service endpoint for memory/profile features.
# 示例 / Example:
# vmm: "http://127.0.0.1:50053"

# 中文：技能覆盖目录。用于覆盖 runtime/skills 中的系统技能。
# English: Skill override directory used to override built-in skills from runtime/skills.
# Windows 示例 / Windows example:
# skills_override: "C:/Users/yourname/.vulcan/vulcan-mcp/skills"
# Linux/macOS 示例 / Linux/macOS example:
# skills_override: "/home/yourname/.vulcan/vulcan-mcp/skills"

# 中文：默认环境使用的有序技能根目录列表，按从高优先级到低优先级排列。
# English: Ordered skill roots for the default environment, from highest priority to lowest priority.
# 可同时使用具名项与纯路径项；推荐显式具名，便于 IDE/宿主识别当前生效技能来源。
# Named entries are recommended so IDE/host integrations can identify the active skill source precisely.
# skill_roots:
#   - name: "USER"
#     path: "C:/Users/yourname/.vulcan/luaskills"
#   - name: "ROOT"
#     path: "D:/projects/vulcan-mcp-client/runtime/skills"

# 中文：可选的统一运行根目录。设置后，configs、skills、dependencies、databases、temp、libs、lua_packages 等目录都会从该根目录派生。
# English: Optional unified runtime root. When set, configs, skills, dependencies, databases, temp, libs, and lua_packages are all derived from this root.
# Windows 示例 / Windows example:
# runtime_root: "D:/projects/vulcan-mcp-client/runtime"
# Linux/macOS 示例 / Linux/macOS example:
# runtime_root: "/opt/vulcan/runtime"

# 中文：依赖目录名称。它会被固定创建在 skills 根目录的同级目录下，位置不可变，仅名称可配。
# English: Dependency directory name. It is always created as a sibling of the skills root; only the directory name is configurable.
# dependency_dir_name: "dependencies"

# ============================================================
# Lua VM Pool
# 中文：Lua 虚拟机池配置。用于并发复用 Lua 运行时，降低频繁建虚拟机的开销。
# English: Lua VM pool settings for concurrent reuse of Lua runtimes and lower VM creation overhead.
# ============================================================

# 中文：Lua 虚拟机池最小常驻实例数。启动后会预热到该数量。
# English: Minimum number of warm Lua VMs kept in the pool after startup.
# 示例 / Example:
lua_vm_pool_min_size: 2

# 中文：Lua 虚拟机池允许的最大实例数。高并发时会按需增长到该上限。
# English: Maximum number of Lua VMs allowed in the pool. The pool can grow on demand up to this limit.
# 示例 / Example:
lua_vm_pool_max_size: 8

# 中文：超过最小常驻数量的 Lua 虚拟机空闲多久后可被回收（秒）。
# English: Idle lifetime in seconds before excess Lua VMs above the minimum warm count may be destroyed.
# 示例 / Example:
lua_vm_pool_idle_ttl_secs: 600

# 中文：受保护技能名称列表。列表中的 skill 只能由宿主 system tools 维护，不能走普通 skills 管理面。
# English: Protected skill names. Skills in this list may only be maintained through host-side system tools, not the ordinary skills plane.
# 示例 / Example:
# protected_skills:
#   - "vulcan-runtime"
