# ============================================================
# Vulcan MCP Runtime Config Template
# 中文：仓库中的配置模板文件。构建后会同步到 output/configs/config.yaml。
# English: Repository config template. It will be synced to output/configs/config.yaml during build.
# ============================================================

# 中文：HTTP MCP 服务监听地址。默认值为 127.0.0.1:19201。
# English: HTTP MCP service listen address. Default is 127.0.0.1:19201.
http: "127.0.0.1:19201"

# 中文：gRPC 管理服务监听地址。默认值为 127.0.0.1:19202。
# English: gRPC management service listen address. Default is 127.0.0.1:19202.
grpc: "127.0.0.1:19202"

# 中文：LanceDb gRPC 服务地址。需要启用 LanceDb 能力时再取消注释。
# English: LanceDb gRPC service endpoint. Uncomment when LanceDb capability is needed.
# 示例 / Example:
lancedb: "http://127.0.0.1:19302"

# 中文：Sqlite gRPC 服务地址。启用后会自动启用共享 scratchpad 能力。
# English: Sqlite gRPC service endpoint. Enabling it also enables shared scratchpad support.
# 示例 / Example:
sqlite: "http://127.0.0.1:19502"

# 中文：VulcanMemoryMesh (VMM) gRPC 服务地址。启用画像、记忆等能力时使用。
# English: VulcanMemoryMesh (VMM) gRPC service endpoint for memory/profile features.
# 示例 / Example:
# vmm: "http://127.0.0.1:50053"

# 中文：Lua Skill 覆盖目录。用于覆盖 runtime/lua_skills 中的系统技能。
# English: Lua Skill override directory used to override built-in skills from runtime/lua_skills.
# Windows 示例 / Windows example:
# lua_skills_override: "C:/Users/yourname/.vulcan/vulcan-mcp/lua_skills"
# Linux/macOS 示例 / Linux/macOS example:
# lua_skills_override: "/home/yourname/.vulcan/vulcan-mcp/lua_skills"

# ============================================================
# Shared Tool Cache
# 中文：共享工具缓存配置。只有发生分页/截断等需要复用结果时才会实际写入缓存。
# English: Shared tool cache settings. Entries are written only when a tool actually needs reusable cached output.
# ============================================================

# 中文：缓存最大条目数。默认 1000，超过后会淘汰较旧缓存。
# English: Maximum number of cache entries. Default is 1000; older entries are evicted when the limit is reached.
# 示例 / Example:
# tool_cache_max_entries: 1000

# 中文：缓存默认有效期（秒）。默认 1800 秒，即 30 分钟。
# English: Default cache TTL in seconds. Default is 1800 seconds (30 minutes).
# 示例 / Example:
# tool_cache_default_ttl_secs: 1800

# 中文：缓存允许的最大有效期（秒）。即使工具请求更大的 TTL，也会被限制到该值。
# English: Maximum allowed cache TTL in seconds. Tool requests above this value are capped.
# 示例 / Example:
# tool_cache_max_ttl_secs: 1800

# ============================================================
# Lua VM Pool
# 中文：Lua 虚拟机池配置。用于并发复用 Lua 运行时，降低频繁建虚拟机的开销。
# English: Lua VM pool settings for concurrent reuse of Lua runtimes and lower VM creation overhead.
# ============================================================

# 中文：Lua 虚拟机池最小常驻实例数。启动后会预热到该数量。
# English: Minimum number of warm Lua VMs kept in the pool after startup.
# 示例 / Example:
lua_vm_pool_min_size: 2

# 中文：Lua 虚拟机池允许的最大实例数。高并发时会按需增长到该上限。
# English: Maximum number of Lua VMs allowed in the pool. The pool can grow on demand up to this limit.
# 示例 / Example:
lua_vm_pool_max_size: 8

# 中文：超过最小常驻数量的 Lua 虚拟机空闲多久后可被回收（秒）。
# English: Idle lifetime in seconds before excess Lua VMs above the minimum warm count may be destroyed.
# 示例 / Example:
lua_vm_pool_idle_ttl_secs: 600
