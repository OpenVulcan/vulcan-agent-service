# 中文：工具级独立配置文件。skills 下的 key 必须是 skill 目录名（例如 vulcan-codekit）。
# English: Standalone tool-level config file. Keys below skills must be skill directory names such as vulcan-codekit.
#
# 中文：每个工具配置只允许一层字段，值可以是标量或标量数组，不允许嵌套对象。
# English: Each tool config may only contain one level of fields, and values may be scalars or scalar arrays only.

# 中文：宿主工具配置格式版本；当前只接受 1。
# English: Host tool config format version; only 1 is accepted.
format_version: 1

skills:
  vulcan-codekit:
    # 中文：预算估算保留字段必须使用 YAML 无符号整数，不接受字符串、负数或浮点数。
    # English: Reserved budget-estimation fields must be YAML unsigned integers; strings, negative values, and floats are rejected.
    bytes_per_token: 3
    unlimited_bytes_cap: 204800
    budget_scope: "tool_result"
